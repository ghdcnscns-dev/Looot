<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>바이킹 야들 - 그룹별 승점 계산기</title>
    <style>
        :root {
            --bg: #1c1714;
            --card-bg: #28211b;
            --card-border: #44372e;
            --text: #f3ebd8;
            --primary: #7a3b2e;
            --accent: #e6c567;
            --accent-bg: #332921;
            --input-bg: #1c1714;
            --input-border: #524337;
            --danger: #d9534f;
        }

        body { 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding: 10px; 
            margin: 0; 
            -webkit-text-size-adjust: 100%;
        }
        .container { max-width: 700px; margin: auto; padding-bottom: 80px; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        h1 { margin: 0; color: var(--accent); font-size: 1.2em; font-weight: 700; }

        /* 플레이어 관리 패널 */
        .player-manage-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .player-manage-header {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 0.95em;
        }
        .player-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .player-tag {
            display: flex;
            align-items: center;
            background: var(--accent-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 4px 8px 4px 10px;
            gap: 4px;
        }
        .player-tag input {
            border: none;
            background: transparent;
            color: var(--text);
            font-weight: bold;
            font-size: 0.9em;
            width: 70px;
        }
        .tag-remove {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.8em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-player-tag-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85em;
        }

        /* 그룹별 카드 섹션 */
        .group-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--card-border);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .group-title-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .group-name {
            font-size: 1.05em;
            font-weight: bold;
            color: var(--accent);
        }
        .group-base-desc {
            font-size: 0.75em;
            background: var(--accent-bg);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
            opacity: 0.85;
        }

        /* 그룹 내 플레이어 입력 행 */
        .group-player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--accent-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
        }
        .gp-name {
            font-weight: bold;
            font-size: 0.9em;
            width: 75px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .gp-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-box-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7em;
            gap: 2px;
            opacity: 0.9;
        }
        input[type="number"] {
            width: 42px;
            height: 36px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 1em;
            -webkit-appearance: none;
        }
        .gp-result {
            font-weight: bold;
            font-size: 0.95em;
            min-width: 45px;
            text-align: right;
            color: var(--text);
        }

        /* 기타 특수 부지 및 트로피/롱쉽 섹션 */
        .special-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .special-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .special-card-title {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 0.95em;
            border-bottom: 2px dashed var(--card-border);
            padding-bottom: 6px;
        }
        .special-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        .special-row:last-child { margin-bottom: 0; }
        .special-row label {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 4px 0;
            cursor: pointer;
        }
        .special-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        /* 실시간 총합 등수 보드 */
        .scoreboard-card {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            position: sticky;
            bottom: 10px;
            z-index: 10;
        }
        .scoreboard-title {
            font-size: 1.1em;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .rank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--accent-bg);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }
        .rank-row:last-child { margin-bottom: 0; }
        .rank-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 0.95em;
        }
        .rank-score {
            font-weight: 800;
            font-size: 1.1em;
            color: var(--accent);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <h1>🛡️ 바이킹 야들 점수 계산기</h1>
    </div>

    <!-- 플레이어 관리 패널 -->
    <div class="player-manage-panel">
        <div class="player-manage-header">👥 게임 참여 플레이어 설정</div>
        <div class="player-tags" id="playerTagsContainer"></div>
    </div>

    <!-- 그룹별 입력 섹션 렌더링 영역 -->
    <div id="groupsContainer"></div>

    <!-- 부가 점수 (완성 부지, 트로피, 미완성 롱쉽) -->
    <div class="special-grid">
        <div class="special-card">
            <div class="special-card-title">🏛️ 완성 부지 보유 현황</div>
            <div id="portContainer"></div>
        </div>
        <div class="special-card">
            <div class="special-card-title">🏆 트로피 & ❌ 미완성 롱쉽</div>
            <div id="bonusContainer"></div>
        </div>
    </div>

    <!-- 실시간 총합 등수 보드 -->
    <div class="scoreboard-card">
        <div class="scoreboard-title">⚡ 실시간 총합 등수 순위표</div>
        <div id="scoreboardContainer"></div>
    </div>
</div>

<script>
    let players = [
        { id: 1, name: "플레이어 1" },
        { id: 2, name: "플레이어 2" }
    ];

    let scores = {
        1: { house:0, houseB:0, watch:0, watchB:0, castle:0, castleB:0, wood:0, woodB:0, sheep:0, sheepB:0, gold:0, goldB:0, port:false, abbey:false, jarl:false, trophy:0, longship:0 },
        2: { house:0, houseB:0, watch:0, watchB:0, castle:0, castleB:0, wood:0, woodB:0, sheep:0, sheepB:0, gold:0, goldB:0, port:false, abbey:false, jarl:false, trophy:0, longship:0 }
    };

    const groupMeta = [
        { key: 'house', name: '🏠 집 그룹', base: 1 },
        { key: 'watch', name: '🗼 망루 그룹', base: 2 },
        { key: 'castle', name: '🏰 성 그룹', base: 4 },
        { key: 'wood', name: '🌲 나무 그룹', base: 1 },
        { key: 'sheep', name: '🐑 양 그룹', base: 1 },
        { key: 'gold', name: '💰 금 그룹', base: 2 }
    ];

    function addPlayer() {
        let newId = Date.now();
        let newName = "플레이어 " + (players.length + 1);
        players.push({ id: newId, name: newName });
        scores[newId] = { house:0, houseB:0, watch:0, watchB:0, castle:0, castleB:0, wood:0, woodB:0, sheep:0, sheepB:0, gold:0, goldB:0, port:false, abbey:false, jarl:false, trophy:0, longship:0 };
        render();
    }

    function removePlayer(id) {
        if(players.length <= 1) {
            alert("최소 1명의 플레이어가 필요합니다.");
            return;
        }
        players = players.filter(p => p.id !== id);
        delete scores[id];
        render();
    }

    function updatePlayerName(id, val) {
        let p = players.find(x => x.id === id);
        if(p) {
            p.name = val;
            // 이름 수정 시 전체 화면(그룹, 특수 부지, 순위표 등)을 갱신하여 동기화
            render();
        }
    }

    function updateVal(pId, field, val) {
        if(scores[pId]) {
            scores[pId][field] = val;
            render();
        }
    }

    function calculateTotal(pId) {
        let s = scores[pId];
        if(!s) return 0;
        let total = 0;
        total += (1 + s.houseB) * s.house;
        total += (2 + s.watchB) * s.watch;
        total += (4 + s.castleB) * s.castle;
        total += (1 + s.woodB) * s.wood;
        total += (1 + s.sheepB) * s.sheep;
        total += (2 + s.goldB) * s.gold;
        
        total += s.port ? 5 : 0;
        total += s.abbey ? 7 : 0;
        total += s.jarl ? 9 : 0;
        total += s.trophy;
        total -= (s.longship * 5);
        return total;
    }

    function render() {
        renderPlayerTags();
        renderGroups();
        renderSpecial();
        renderScoreboard();
    }

    function renderPlayerTags() {
        let html = "";
        players.forEach(p => {
            html += `<div class="player-tag">
                <input type="text" value="${p.name}" oninput="updatePlayerName(${p.id}, this.value)">
                <button class="tag-remove" onclick="removePlayer(${p.id})">×</button>
            </div>`;
        });
        html += `<button class="add-player-tag-btn" onclick="addPlayer()">+ 추가</button>`;
        document.getElementById("playerTagsContainer").innerHTML = html;
    }

    function renderGroups() {
        let html = "";
        groupMeta.forEach(g => {
            html += `<div class="group-section">
                <div class="group-header">
                    <div class="group-title-area">
                        <span class="group-name">${g.name}</span>
                        <span class="group-base-desc">기본 ${g.base}점</span>
                    </div>
                </div>
                <div class="group-rows">`;
            
            players.forEach(p => {
                let s = scores[p.id];
                let bonus = s[g.key + 'B'];
                let count = s[g.key];
                let subTotal = (g.base + bonus) * count;

                html += `<div class="group-player-row">
                    <span class="gp-name" title="${p.name}">${p.name}</span>
                    <div class="gp-inputs">
                        <div class="input-box-wrapper">
                            <span>롱쉽보너스</span>
                            <input type="number" pattern="[0-9]*" value="${bonus}" onchange="updateVal(${p.id}, '${g.key}B', +this.value)">
                        </div>
                        <div style="opacity:0.4;">×</div>
                        <div class="input-box-wrapper">
                            <span>타일개수</span>
                            <input type="number" pattern="[0-9]*" value="${count}" onchange="updateVal(${p.id}, '${g.key}', +this.value)">
                        </div>
                        <div style="opacity:0.4;">=</div>
                        <div class="gp-result">${subTotal}점</div>
                    </div>
                </div>`;
            });

            html += `</div></div>`;
        });
        document.getElementById("groupsContainer").innerHTML = html;
    }

    function renderSpecial() {
        let portHtml = "";
        players.forEach(p => {
            let s = scores[p.id];
            portHtml += `<div class="special-row">
                <span style="font-weight:bold; width:75px;" title="${p.name}">${p.name}</span>
                <div style="display:flex; gap:6px; font-size:0.8em;">
                    <label><input type="checkbox" ${s.port?'checked':''} onchange="updateVal(${p.id}, 'port', this.checked)"> 항구(+5)</label>
                    <label><input type="checkbox" ${s.abbey?'checked':''} onchange="updateVal(${p.id}, 'abbey', this.checked)"> 예배소(+7)</label>
                    <label><input type="checkbox" ${s.jarl?'checked':''} onchange="updateVal(${p.id}, 'jarl', this.checked)"> 야를(+9)</label>
                </div>
            </div>`;
        });
        document.getElementById("portContainer").innerHTML = portHtml;

        let bonusHtml = "";
        players.forEach(p => {
            let s = scores[p.id];
            bonusHtml += `<div class="special-row">
                <span style="font-weight:bold; width:75px;" title="${p.name}">${p.name}</span>
                <div style="display:flex; gap:8px; align-items:center;">
                    <div class="input-box-wrapper"><span>트로피 총점</span><input type="number" pattern="[0-9]*" value="${s.trophy}" onchange="updateVal(${p.id}, 'trophy', +this.value)"></div>
                    <div class="input-box-wrapper"><span style="color:var(--danger)">미완성롱쉽(-5)</span><input type="number" pattern="[0-9]*" value="${s.longship}" onchange="updateVal(${p.id}, 'longship', +this.value)" style="color:var(--danger)"></div>
                </div>
            </div>`;
        });
        document.getElementById("bonusContainer").innerHTML = bonusHtml;
    }

    function renderScoreboard() {
        let ranked = players.map(p => ({
            ...p,
            total: calculateTotal(p.id)
        })).sort((a, b) => b.total - a.total);

        let html = "";
        ranked.forEach((p, idx) => {
            let badge = idx === 0 ? "👑 1위" : `${idx + 1}위`;
            html += `<div class="rank-row">
                <div class="rank-info">
                    <span style="color:var(--accent); min-width:35px;">${badge}</span>
                    <span>${p.name}</span>
                </div>
                <div class="rank-score">${p.total} 점</div>
            </div>`;
        });
        document.getElementById("scoreboardContainer").innerHTML = html;
    }

    render();
</script>
</body>
</html>
