<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이킹 야들 - 승점 계산기</title>
    <style>
        :root {
            --bg: #f5f2eb;
            --card-bg: #ffffff;
            --text: #2c251e;
            --primary: #4a5d4e;
            --primary-hover: #3b4a3e;
            --accent: #8b5a2b;
            --gold: #b8860b;
            --border: #d4c5b9;
            --input-bg: #faf8f5;
            --header-bg: #f0eae1;
        }

        [data-theme="viking"] {
            --bg: #1e1915;
            --card-bg: #2d241d;
            --text: #f3ebd8;
            --primary: #6b3e2e;
            --primary-hover: #543023;
            --accent: #d4af37;
            --gold: #e6c567;
            --border: #4a3b2c;
            --input-bg: #1e1915;
            --header-bg: #382c23;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #fbbf24;
            --gold: #f59e0b;
            --border: #333333;
            --input-bg: #2a2a2a;
            --header-bg: #252525;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding: 15px; 
            margin: 0; 
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 650px; margin: auto; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { margin: 0; color: var(--gold); font-size: 1.6em; text-align: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

        .theme-selector {
            display: flex;
            gap: 4px;
        }
        .theme-btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 10px;
            font-size: 0.8em;
            border-radius: 4px;
            cursor: pointer;
        }
        .theme-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .player-card { 
            background: var(--card-bg); 
            border: 2px solid var(--border); 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            transition: background 0.3s, border 0.3s;
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .player-name-input {
            font-size: 1.2em;
            font-weight: bold;
            width: 60%;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
        }

        /* 그룹별 점수 테이블 디자인 */
        .score-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .score-table th, .score-table td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
        }

        .score-table th {
            background-color: var(--header-bg);
            color: var(--gold);
            font-weight: 600;
        }

        .score-table td input[type="number"] {
            width: 45px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }

        .sub-section {
            background: var(--header-bg);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .sub-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
        }

        .sub-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 5px solid var(--gold);
        }

        .total-score-text { 
            font-weight: bold; 
            color: var(--gold); 
            font-size: 1.4em; 
        }

        button { cursor: pointer; padding: 10px 15px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .remove-btn { background: #a93226; padding: 6px 10px; font-size: 0.85em; }
        .remove-btn:hover { background: #922b21; }
        
        .add-player-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            background: var(--primary);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <h1>⚔️ 바이킹 야들 점수 계산기</h1>
        <div class="theme-selector">
            <button class="theme-btn active" onclick="setTheme('light', this)">기본</button>
            <button class="theme-btn" onclick="setTheme('viking', this)">양피지</button>
            <button class="theme-btn" onclick="setTheme('dark', this)">다크</button>
        </div>
    </div>

    <div id="playerList"></div>
    <button class="add-player-btn" onclick="addPlayer()">+ 플레이어 추가</button>
</div>

<script>
    function setTheme(theme, btn) {
        if(theme === 'light') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', theme);
        }
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    let players = [{ 
        id: Date.now(), 
        name: "플레이어 1", 
        scores: { house:0, houseB:0, watch:0, watchB:0, castle:0, castleB:0, wood:0, woodB:0, sheep:0, sheepB:0, gold:0, goldB:0, port:false, abbey:false, jarl:false, trophy:0, longship:0 } 
    }];

    function addPlayer() {
        players.push({ 
            id: Date.now(), 
            name: "플레이어 " + (players.length + 1), 
            scores: { house:0, houseB:0, watch:0, watchB:0, castle:0, castleB:0, wood:0, woodB:0, sheep:0, sheepB:0, gold:0, goldB:0, port:false, abbey:false, jarl:false, trophy:0, longship:0 } 
        });
        render();
    }

    function removePlayer(id) {
        players = players.filter(p => p.id !== id);
        render();
    }

    function updateScore(pId, field, value) {
        let p = players.find(p => p.id === pId);
        p.scores[field] = value;
        render();
    }

    function calculate(p) {
        let s = p.scores;
        let total = 0;
        // 그룹별 점수: (기본점수 + 롱쉽보너스) × 타일개수
        let houseScore = (1 + s.houseB) * s.house;
        let watchScore = (2 + s.watchB) * s.watch;
        let castleScore = (4 + s.castleB) * s.castle;
        let woodScore = (1 + s.woodB) * s.wood;
        let sheepScore = (1 + s.sheepB) * s.sheep;
        let goldScore = (2 + s.goldB) * s.gold;

        total += houseScore + watchScore + castleScore + woodScore + sheepScore + goldScore;
        
        // 완성 부지 점수
        total += s.port ? 5 : 0;
        total += s.abbey ? 7 : 0;
        total += s.jarl ? 9 : 0;
        
        // 트로피 및 미완성 롱쉽 감점
        total += s.trophy;
        total -= (s.longship * 5);
        return total;
    }

    // 그룹별 획득 점수 계산 헬퍼
    function getGroupSubtotal(s) {
        return {
            house: (1 + s.houseB) * s.house,
            watch: (2 + s.watchB) * s.watch,
            castle: (4 + s.castleB) * s.castle,
            wood: (1 + s.woodB) * s.wood,
            sheep: (1 + s.sheepB) * s.sheep,
            gold: (2 + s.goldB) * s.gold
        };
    }

    function render() {
        players.sort((a,b) => calculate(b) - calculate(a));
        let html = "";
        
        players.forEach((p, index) => {
            let sub = getGroupSubtotal(p.scores);
            let rankBadge = index === 0 ? "👑 1위" : `${index + 1}위`;

            html += `<div class="player-card">
                <div class="player-header">
                    <input type="text" class="player-name-input" value="${p.name}" onchange="p.name=this.value">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:bold; color:var(--gold);">${rankBadge}</span>
                        <button class="remove-btn" onclick="removePlayer(${p.id})">삭제</button>
                    </div>
                </div>

                <!-- 그룹별 점수판 테이블 -->
                <table class="score-table">
                    <thead>
                        <tr>
                            <th>그룹명</th>
                            <th>기본</th>
                            <th>롱쉽보너스</th>
                            <th>타일개수</th>
                            <th>그룹 획득 점수</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>🏡 집</td>
                            <td>1점</td>
                            <td>+<input type="number" value="${p.scores.houseB}" onchange="updateScore(${p.id},'houseB',+this.value)"></td>
                            <td><input type="number" value="${p.scores.house}" onchange="updateScore(${p.id},'house',+this.value)">개</td>
                            <td><b>${sub.house}점</b></td>
                        </tr>
                        <tr>
                            <td>🗼 망루</td>
                            <td>2점</td>
                            <td>+<input type="number" value="${p.scores.watchB}" onchange="updateScore(${p.id},'watchB',+this.value)"></td>
                            <td><input type="number" value="${p.scores.watch}" onchange="updateScore(${p.id},'watch',+this.value)">개</td>
                            <td><b>${sub.watch}점</b></td>
                        </tr>
                        <tr>
                            <td>🏰 성</td>
                            <td>4점</td>
                            <td>+<input type="number" value="${p.scores.castleB}" onchange="updateScore(${p.id},'castleB',+this.value)"></td>
                            <td><input type="number" value="${p.scores.castle}" onchange="updateScore(${p.id},'castle',+this.value)">개</td>
                            <td><b>${sub.castle}점</b></td>
                        </tr>
                        <tr>
                            <td>🌲 나무</td>
                            <td>1점</td>
                            <td>+<input type="number" value="${p.scores.woodB}" onchange="updateScore(${p.id},'woodB',+this.value)"></td>
                            <td><input type="number" value="${p.scores.wood}" onchange="updateScore(${p.id},'wood',+this.value)">개</td>
                            <td><b>${sub.wood}점</b></td>
                        </tr>
                        <tr>
                            <td>🐑 양</td>
                            <td>1점</td>
                            <td>+<input type="number" value="${p.scores.sheepB}" onchange="updateScore(${p.id},'sheepB',+this.value)"></td>
                            <td><input type="number" value="${p.scores.sheep}" onchange="updateScore(${p.id},'sheep',+this.value)">개</td>
                            <td><b>${sub.sheep}점</b></td>
                        </tr>
                        <tr>
                            <td>💰 금</td>
                            <td>2점</td>
                            <td>+<input type="number" value="${p.scores.goldB}" onchange="updateScore(${p.id},'goldB',+this.value)"></td>
                            <td><input type="number" value="${p.scores.gold}" onchange="updateScore(${p.id},'gold',+this.value)">개</td>
                            <td><b>${sub.gold}점</b></td>
                        </tr>
                    </tbody>
                </table>

                <!-- 부가 점수 영역 -->
                <div class="sub-section">
                    <div class="sub-row">
                        <span>🏛️ 완성 부지 (체크 시 적용)</span>
                        <div style="display:flex; gap:10px;">
                            <label><input type="checkbox" ${p.scores.port?'checked':''} onchange="updateScore(${p.id},'port',this.checked)"> 항구(+5)</label>
                            <label><input type="checkbox" ${p.scores.abbey?'checked':''} onchange="updateScore(${p.id},'abbey',this.checked)"> 예배소(+7)</label>
                            <label><input type="checkbox" ${p.scores.jarl?'checked':''} onchange="updateScore(${p.id},'jarl',this.checked)"> 야를(+9)</label>
                        </div>
                    </div>
                    <div class="sub-row">
                        <span>🏆 트로피 타일 총점</span>
                        <input type="number" value="${p.scores.trophy}" onchange="updateScore(${p.id},'trophy',+this.value)" style="width:60px; text-align:center; font-weight:bold;">
                    </div>
                    <div class="sub-row">
                        <span>❌ 미완성 롱쉽 감점 (개당 -5점)</span>
                        <input type="number" value="${p.scores.longship}" onchange="updateScore(${p.id},'longship',+this.value)" style="width:60px; text-align:center; font-weight:bold; color:#a93226;">
                    </div>
                </div>

                <!-- 총점 박스 -->
                <div class="total-box">
                    <span>최종 승점 합산</span>
                    <span class="total-score-text">${calculate(p)} 점</span>
                </div>
            </div>`;
        });
        document.getElementById("playerList").innerHTML = html;
    }
    render();
</script>
</body>
</html>
